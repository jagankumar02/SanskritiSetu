<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SanskritiSetu</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="supabase.js"></script>

    <style>
        :root {
            --deep: #472836;
            --deep-2: #5d3445;

            --teal: #4059AD;
            --blue: #6B9AC4;
            --mint: #97D8C4;
            --gold: #F4B942;

            --cream: #fffaf0;
            --cream-2: #f8f1e5;

            --white: #ffffff;
            --text: #28202a;
            --muted: #756a72;

            --border: rgba(71, 40, 54, 0.11);
            --shadow: 0 20px 60px rgba(71, 40, 54, 0.10);
            --shadow-soft: 0 10px 30px rgba(71, 40, 54, 0.07);

            --sidebar-width: 255px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Plus Jakarta Sans", sans-serif;
            background:
                radial-gradient(circle at 10% 10%, rgba(151,216,196,0.18), transparent 25%),
                radial-gradient(circle at 90% 20%, rgba(244,185,66,0.12), transparent 25%),
                linear-gradient(135deg, #fffaf0 0%, #f8f1e5 100%);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        button,
        input,
        textarea,
        select {
            font-family: inherit;
        }

        button {
            border: none;
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* =========================
           LOADING
        ========================= */

        .loading-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--cream);
            transition: opacity .35s ease, visibility .35s ease;
        }

        .loading-screen.hide {
            opacity: 0;
            visibility: hidden;
        }

        .loading-box {
            text-align: center;
        }

        .loading-logo {
            width: 75px;
            height: 75px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            background: linear-gradient(135deg, var(--deep), var(--teal));
            color: white;
            font-size: 34px;
            font-weight: 800;
            box-shadow: 0 20px 50px rgba(71,40,54,.25);
        }

        .loading-box p {
            margin-top: 18px;
            color: var(--muted);
            font-size: 14px;
        }

        .loader {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(64,89,173,.15);
            border-top-color: var(--teal);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: 18px auto 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           APP
        ========================= */

        .app {
            min-height: 100vh;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            left: 18px;
            top: 18px;
            bottom: 18px;
            width: var(--sidebar-width);

            padding: 20px 14px;

            background: rgba(255,255,255,.62);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

            border: 1px solid rgba(255,255,255,.75);
            border-radius: 28px;

            box-shadow: var(--shadow);

            z-index: 1000;

            display: flex;
            flex-direction: column;

            transition: transform .3s ease;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 4px 8px 22px;
        }

        .brand-logo {
            width: 44px;
            height: 44px;
            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(135deg, var(--deep), var(--teal));
            color: white;

            font-size: 21px;
            font-weight: 800;

            box-shadow: 0 12px 25px rgba(71,40,54,.18);
        }

        .brand-text h2 {
            font-size: 17px;
            font-weight: 800;
            color: var(--deep);
        }

        .brand-text span {
            font-size: 10px;
            color: var(--muted);
        }

        .nav-label {
            padding: 10px 10px 7px;
            font-size: 10px;
            font-weight: 800;
            color: #a0969c;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
            padding-right: 3px;
        }

        .nav::-webkit-scrollbar {
            width: 3px;
        }

        .nav::-webkit-scrollbar-thumb {
            background: rgba(71,40,54,.12);
            border-radius: 20px;
        }

        .nav-item {
            width: 100%;
            padding: 11px 12px;

            display: flex;
            align-items: center;
            gap: 11px;

            border-radius: 13px;

            color: #62565e;
            background: transparent;

            font-size: 12px;
            font-weight: 600;

            text-align: left;

            transition: all .22s ease;
        }

        .nav-item i {
            width: 17px;
            height: 17px;
            flex-shrink: 0;
        }

        .nav-item:hover {
            color: var(--deep);
            background: rgba(255,255,255,.72);
            transform: translateX(2px);
        }

        .nav-item.active {
            color: white;
            background: linear-gradient(135deg, var(--deep), var(--teal));
            box-shadow: 0 9px 25px rgba(64,89,173,.20);
        }

        .sidebar-bottom {
            margin-top: auto;
            padding-top: 15px;
        }

        .mini-profile {
            padding: 11px;
            border-radius: 17px;
            background: rgba(255,255,255,.62);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(135deg, var(--mint), var(--blue));
            color: var(--deep);
            font-weight: 800;
            font-size: 12px;
            flex-shrink: 0;
        }

        .mini-profile-info {
            min-width: 0;
        }

        .mini-profile-info strong {
            display: block;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-profile-info span {
            display: block;
            color: var(--muted);
            font-size: 9px;
            margin-top: 2px;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            margin-left: calc(var(--sidebar-width) + 36px);
            padding: 18px 22px 40px 0;
            min-height: 100vh;
        }

        .topbar {
            height: 66px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .mobile-menu {
            display: none;
            width: 42px;
            height: 42px;
            border-radius: 13px;
            background: rgba(255,255,255,.7);
            border: 1px solid var(--border);
            color: var(--deep);
        }

        .page-heading h1 {
            font-size: 22px;
            font-weight: 800;
            color: var(--deep);
        }

        .page-heading p {
            color: var(--muted);
            font-size: 11px;
            margin-top: 3px;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .icon-btn {
            width: 41px;
            height: 41px;
            border-radius: 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(255,255,255,.68);
            border: 1px solid var(--border);
            color: var(--deep);

            transition: .2s ease;
        }

        .icon-btn:hover {
            transform: translateY(-2px);
            background: white;
            box-shadow: var(--shadow-soft);
        }

        .top-profile {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 4px 10px 4px 4px;

            background: rgba(255,255,255,.65);
            border: 1px solid var(--border);
            border-radius: 16px;

            cursor: pointer;
        }

        .top-profile .avatar {
            width: 33px;
            height: 33px;
            border-radius: 10px;
        }

        .top-profile-text strong {
            display: block;
            font-size: 10px;
        }

        .top-profile-text span {
            font-size: 9px;
            color: var(--muted);
        }

        /* =========================
           CONTENT
        ========================= */

        #pageContent {
            animation: pageIn .25s ease;
        }

        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translateY(7px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 270px;
            border-radius: 27px;

            position: relative;
            overflow: hidden;

            display: flex;
            align-items: center;

            padding: 35px;

            background:
                linear-gradient(90deg, rgba(45,24,35,.91), rgba(71,40,54,.67), rgba(71,40,54,.20)),
                url("https://images.unsplash.com/photo-1605640840605-14ac1855827b?auto=format&fit=crop&w=1600&q=85");

            background-size: cover;
            background-position: center;

            box-shadow: var(--shadow);
        }

        .hero-content {
            max-width: 650px;
            color: white;
            position: relative;
            z-index: 2;
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            padding: 7px 11px;
            border-radius: 30px;

            background: rgba(255,255,255,.13);
            border: 1px solid rgba(255,255,255,.2);

            font-size: 10px;
            font-weight: 700;

            margin-bottom: 14px;
        }

        .hero h2 {
            font-size: clamp(27px, 4vw, 43px);
            line-height: 1.08;
            font-weight: 800;
            letter-spacing: -1.5px;
        }

        .hero p {
            font-size: 12px;
            line-height: 1.7;
            color: rgba(255,255,255,.82);
            margin-top: 13px;
            max-width: 570px;
        }

        .hero-location {
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: rgba(255,255,255,.75);
        }

        .hero-location i {
            width: 14px;
        }

        /* =========================
           BUTTONS
        ========================= */

        .primary-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            padding: 11px 16px;

            border-radius: 12px;

            background: linear-gradient(135deg, var(--deep), var(--teal));
            color: white;

            font-size: 11px;
            font-weight: 700;

            box-shadow: 0 10px 25px rgba(64,89,173,.18);

            transition: .2s ease;
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(64,89,173,.25);
        }

        .secondary-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            padding: 10px 14px;

            border-radius: 11px;

            background: rgba(255,255,255,.72);
            border: 1px solid var(--border);

            color: var(--deep);

            font-size: 10px;
            font-weight: 700;

            transition: .2s ease;
        }

        .secondary-btn:hover {
            background: white;
            transform: translateY(-2px);
        }

        /* =========================
           STATS
        ========================= */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 13px;
            margin-top: 15px;
        }

        .stat-card {
            padding: 18px;
            border-radius: 19px;

            background: rgba(255,255,255,.62);
            border: 1px solid rgba(255,255,255,.75);

            box-shadow: var(--shadow-soft);

            transition: .22s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
        }

        .stat-icon {
            width: 35px;
            height: 35px;
            border-radius: 11px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(151,216,196,.25);
            color: var(--deep);
        }

        .stat-icon i {
            width: 17px;
        }

        .stat-card:nth-child(2) .stat-icon {
            background: rgba(107,154,196,.18);
        }

        .stat-card:nth-child(3) .stat-icon {
            background: rgba(244,185,66,.18);
        }

        .stat-card:nth-child(4) .stat-icon {
            background: rgba(64,89,173,.12);
        }

        .stat-value {
            font-size: 24px;
            font-weight: 800;
            color: var(--deep);
            margin-top: 11px;
        }

        .stat-label {
            color: var(--muted);
            font-size: 9px;
            margin-top: 2px;
        }

        /* =========================
           SECTION HEAD
        ========================= */

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 27px 2px 13px;
        }

        .section-head h3 {
            font-size: 16px;
            color: var(--deep);
            font-weight: 800;
        }

        .section-head span {
            color: var(--muted);
            font-size: 9px;
        }

        /* =========================
           EXPLORE
        ========================= */

        .explore-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 13px;
        }

        .explore-card {
            position: relative;
            overflow: hidden;
            min-height: 175px;

            border-radius: 20px;

            cursor: pointer;

            background-size: cover;
            background-position: center;

            box-shadow: var(--shadow-soft);

            transition: .25s ease;
        }

        .explore-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow);
        }

        .explore-card::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 15%, rgba(40,20,30,.9));
        }

        .explore-info {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            z-index: 2;
            color: white;
        }

        .explore-info .small {
            font-size: 8px;
            opacity: .72;
            text-transform: uppercase;
            letter-spacing: .7px;
        }

        .explore-info h4 {
            font-size: 14px;
            margin-top: 3px;
        }

        .explore-info p {
            font-size: 9px;
            opacity: .76;
            margin-top: 4px;
            line-height: 1.4;
        }

        /* =========================
           LOWER GRID
        ========================= */

        .two-grid {
            display: grid;
            grid-template-columns: 1.35fr .9fr;
            gap: 14px;
            margin-top: 15px;
        }

        .glass-card {
            border-radius: 20px;
            background: rgba(255,255,255,.63);
            border: 1px solid rgba(255,255,255,.75);
            box-shadow: var(--shadow-soft);
            padding: 20px;
        }

        .discovery {
            min-height: 220px;

            background:
                linear-gradient(90deg, rgba(71,40,54,.96), rgba(71,40,54,.70)),
                url("https://images.unsplash.com/photo-1532375810709-75b1da00537c?auto=format&fit=crop&w=1200&q=80");

            background-size: cover;
            background-position: center;

            color: white;
        }

        .discovery .label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: .7;
        }

        .discovery h3 {
            font-size: 22px;
            margin-top: 9px;
            max-width: 500px;
        }

        .discovery p {
            font-size: 10px;
            line-height: 1.7;
            opacity: .78;
            margin-top: 10px;
            max-width: 570px;
        }

        .discovery .secondary-btn {
            margin-top: 17px;
            background: rgba(255,255,255,.12);
            border-color: rgba(255,255,255,.2);
            color: white;
        }

        .profile-card {
            display: flex;
            flex-direction: column;
        }

        .profile-head {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-head .avatar {
            width: 48px;
            height: 48px;
            border-radius: 16px;
        }

        .profile-head h3 {
            font-size: 14px;
        }

        .profile-head p {
            font-size: 9px;
            color: var(--muted);
            margin-top: 3px;
        }

        .profile-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 18px;
        }

        .detail {
            padding: 10px;
            border-radius: 12px;
            background: rgba(255,255,255,.56);
            border: 1px solid var(--border);
        }

        .detail span {
            display: block;
            font-size: 8px;
            color: var(--muted);
        }

        .detail strong {
            display: block;
            font-size: 10px;
            margin-top: 4px;
            color: var(--deep);
            word-break: break-word;
        }

        /* =========================
           PAGE COMMON
        ========================= */

        .page-title-card {
            padding: 25px;
            border-radius: 23px;

            background:
                radial-gradient(circle at 90% 10%, rgba(151,216,196,.28), transparent 30%),
                rgba(255,255,255,.65);

            border: 1px solid rgba(255,255,255,.75);
            box-shadow: var(--shadow-soft);
        }

        .page-title-card .eyebrow {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--teal);
        }

        .page-title-card h2 {
            color: var(--deep);
            font-size: 27px;
            margin-top: 6px;
        }

        .page-title-card p {
            color: var(--muted);
            font-size: 11px;
            line-height: 1.7;
            max-width: 750px;
            margin-top: 7px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-top: 15px;
        }

        /* =========================
           ARTISTS
        ========================= */

        .artist-card {
            overflow: hidden;
            border-radius: 19px;
            background: rgba(255,255,255,.68);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-soft);
            transition: .22s ease;
        }

        .artist-card:hover {
            transform: translateY(-4px);
        }

        .artist-image {
            height: 165px;
            background-size: cover;
            background-position: center;
        }

        .artist-body {
            padding: 16px;
        }

        .artist-tag {
            display: inline-block;
            padding: 5px 8px;
            border-radius: 20px;
            background: rgba(151,216,196,.23);
            color: var(--deep);
            font-size: 8px;
            font-weight: 800;
        }

        .artist-body h3 {
            font-size: 14px;
            margin-top: 9px;
            color: var(--deep);
        }

        .artist-body p {
            color: var(--muted);
            font-size: 9px;
            line-height: 1.65;
            margin-top: 6px;
        }

        .artist-footer {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .artist-footer span {
            font-size: 8px;
            color: var(--muted);
        }

        /* =========================
           GAMES
        ========================= */

        .game-card {
            padding: 21px;
            border-radius: 20px;
            background: rgba(255,255,255,.68);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-soft);
            transition: .22s ease;
        }

        .game-card:hover {
            transform: translateY(-4px);
        }

        .game-icon {
            width: 47px;
            height: 47px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(151,216,196,.5), rgba(107,154,196,.25));
            color: var(--deep);
        }

        .game-icon i {
            width: 22px;
        }

        .game-card h3 {
            font-size: 14px;
            color: var(--deep);
            margin-top: 14px;
        }

        .game-card p {
            font-size: 9px;
            line-height: 1.65;
            color: var(--muted);
            margin-top: 6px;
        }

        .game-meta {
            display: flex;
            gap: 7px;
            margin-top: 13px;
        }

        .pill {
            padding: 5px 8px;
            border-radius: 20px;
            background: rgba(71,40,54,.06);
            font-size: 8px;
            color: var(--muted);
        }

        .game-card .primary-btn {
            width: 100%;
            margin-top: 15px;
        }

        /* =========================
           MAP
        ========================= */

        .map-layout {
            display: grid;
            grid-template-columns: .85fr 1.6fr;
            gap: 14px;
            margin-top: 15px;
        }

        .map-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .place-item {
            padding: 13px;
            border-radius: 15px;
            background: rgba(255,255,255,.65);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: .2s ease;
        }

        .place-item:hover,
        .place-item.selected {
            background: white;
            border-color: rgba(64,89,173,.25);
            transform: translateX(3px);
        }

        .place-item-top {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .place-icon {
            width: 33px;
            height: 33px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(244,185,66,.17);
            color: var(--deep);
            flex-shrink: 0;
        }

        .place-item h4 {
            font-size: 10px;
            color: var(--deep);
        }

        .place-item p {
            font-size: 8px;
            color: var(--muted);
            margin-top: 3px;
        }

        .map-box {
            min-height: 500px;
            overflow: hidden;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: #e9e3d8;
            position: relative;
        }

        .map-box iframe {

            font-size: 8px;
            line-height: 1.5;
            color: var(--muted);
            margin-top: 4px;
        }

        /* =========================
           AI CULTURE
        ========================= */

        .ai-layout {
            display: grid;
            grid-template-columns: .75fr 1.5fr;
            gap: 15px;

        }

        .ai-side {
            padding: 22px;

            align-items: center;

        ========================= */

        ========================= */

        .empty-card {

        .empty-card p {
            color: var(--muted);

        /* =========================
           TOAST
        ========================= */

        .toast {
            position: fixed;
            right: 25px;
            bottom: 25px;
            z-index: 5000;

            display: flex;
            align-items: center;
            gap: 9px;

            padding: 13px 16px;

            background: var(--deep);
            color: white;

            border-radius: 13px;
            box-shadow: 0 15px 40px rgba(71,40,54,.25);

            font-size: 10px;

            transform: translateY(80px);
            opacity: 0;
            pointer-events: none;

            transition: .3s ease;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1100px) {
            .stats-grid,
            .explore-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .content-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .badge-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 850px) {

                --sidebar-width: 255px;

            }

                margin-left: 0;

            }

                display: flex;

                grid-template-columns: 1fr;
            }

                grid-template-columns: 1fr;
            }
        }

            .top-profile-text {
                display: none;

            backdrop-filter: blur(3px);

            display: none;
        }

        .sidebar-overlay.show {
            display: block;
        }
    </style>
</head>

    <script>

        /* =========================================================
           SUPABASE
           =========================================================

           IMPORTANT:
           Agar tumhare existing supabase.js me already
           supabaseClient bana hua hai, ye code usi ko use karega.

           Example existing supabase.js:

           const SUPABASE_URL = "YOUR_URL";
           const SUPABASE_PUBLISHABLE_KEY = "YOUR_KEY";

           const supabaseClient =
               window.supabase.createClient(
                   SUPABASE_URL,
                   SUPABASE_PUBLISHABLE_KEY
               );

        ========================================================= */

        let currentUser = null;

        const pageContent = document.getElementById("pageContent");
        const sidebar = document.getElementById("sidebar");
        const sidebarOverlay = document.getElementById("sidebarOverlay");

        /* =========================================================
           PAGE INFORMATION
        ========================================================= */

        const pageInfo = {

            dashboard: {
                title: "Dashboard",
                subtitle: "Explore, learn and connect with India's cultural heritage."
            },

            artists: {
                title: "Artists & Crafts",
                subtitle: "Discover India's traditional artists, crafts and living heritage."
            },

            games: {
                title: "Cultural Games",
                subtitle: "Learn India's culture through interactive challenges and games."
            },

            map: {
                title: "Cultural Map",
                subtitle: "Explore important cultural places, traditions and heritage across India."
            },

            ai: {
                title: "AI Culture",
                subtitle: "Ask questions and discover India's culture with your AI cultural guide."
            },

            learning: {
                title: "My Learning",
                subtitle: "Continue your journey through India's history, art and traditions."
            },

            badges: {
                title: "XP & Badges",
                subtitle: "Earn XP by exploring culture and unlock new achievements."
            },

            progress: {
                title: "My Progress",
                subtitle: "See how your cultural exploration is growing over time."
            },

            profile: {
                title: "Profile",
                subtitle: "Your cultural explorer profile and personal interests."
            }

        };


        /* =========================================================
           HELPERS
        ========================================================= */

        function getInitials(name) {

            if (!name) return "EX";

            const parts = name.trim().split(/\s+/);

            if (parts.length === 1) {
                return parts[0].substring(0, 2).toUpperCase();
            }

            return (
                parts[0][0] +
                parts[parts.length - 1][0]
            ).toUpperCase();
        }


        function escapeHTML(value) {

            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        function showToast(message) {

            const toast = document.getElementById("toast");
            const toastMessage = document.getElementById("toastMessage");

            toastMessage.textContent = message;

            toast.classList.add("show");

            setTimeout(() => {
                toast.classList.remove("show");
            }, 2800);
        }


        function refreshIcons() {

            if (window.lucide) {
                lucide.createIcons();
            }
        }


        /* =========================================================
           GET USER
        ========================================================= */

        async function getLoggedInUser() {

            try {

                if (
                    typeof getCurrentUser === "function"
                ) {

                    const user = await getCurrentUser();

                    if (user) {
                        return user;
                    }
                }

            } catch (error) {

                console.log("getCurrentUser unavailable:", error);

            }


            try {

                if (
                    typeof supabaseClient !== "undefined" &&
                    supabaseClient.auth
                ) {

                    const result =
                        await supabaseClient.auth.getUser();

                    return result?.data?.user || null;
                }

            } catch (error) {

                console.log("Supabase user error:", error);

            }

            return null;
        }


        /* =========================================================
           USER PROFILE DATA
        ========================================================= */

        let profileDataFromDB = null;


/* =========================================================
   LOAD USER PROFILE FROM SUPABASE
========================================================= */

async function loadUserProfile() {

    try {

        if (!currentUser?.id) {
            console.warn("No logged-in user found.");
            return null;
        }


        if (
            typeof supabaseClient === "undefined" ||
            !supabaseClient
        ) {
            console.error("Supabase client not available.");
            return null;
        }


        const {
            data,
            error
        } = await supabaseClient
            .from("sanskriti_profiles")
            .select(`
                id,
                user_id,
                full_name,
                email,
                state,
                city,
                interests,
                profession,
                preferred_language,
                created_at
            `)
            .eq("user_id", currentUser.id)
            .maybeSingle();


        if (error) {

            console.error(
                "Profile fetch error:",
                error
            );

            return null;

        }


        if (data) {

            profileDataFromDB = data;

            console.log(
                "SanskritiSetu profile loaded:",
                data
            );

            return data;

        }


        console.warn(
            "No SanskritiSetu profile found for this user."
        );

        return null;


    } catch (error) {

        console.error(
            "Unexpected profile loading error:",
            error
        );

        return null;

    }

}


/* =========================================================
   GET PROFILE DATA
========================================================= */

function getProfileData() {

    const metadata =
        currentUser?.user_metadata || {};


    const databaseProfile =
        profileDataFromDB || {};


    return {

        fullName:
            databaseProfile.full_name ||
            metadata.full_name ||
            currentUser?.email?.split("@")[0] ||
            "Explorer",


        email:
            databaseProfile.email ||
            currentUser?.email ||
            "Not available",


        state:
            databaseProfile.state ||
            metadata.state ||
            "Not selected",


        city:
            databaseProfile.city ||
            metadata.city ||
            "Not selected",


        interests:
            databaseProfile.interests ||
            metadata.interests ||
            "Culture & Heritage",


        profession:
            databaseProfile.profession ||
            metadata.profession ||
            "Cultural Explorer",


        language:
            databaseProfile.preferred_language ||
            metadata.preferred_language ||
            metadata.language ||
            "English"

    };

}


        /* =========================================================
           UPDATE USER UI
        ========================================================= */

        function updateUserUI() {

            const profile = getProfileData();

            const initials =

        function askSuggestion(question) {

            const input =
                document.getElementById("aiInput");

            if (!input) return;

            input.value = question;

            sendAIMessage();
        }


        function handleAIKey(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendAIMessage();

            }

        }


        function addChatMessage(
            text,
            type
        ) {

            const messages =
                document.getElementById("chatMessages");

            if (!messages) return;

            const div =
                document.createElement("div");

            div.className =
                "message " + type;

            div.textContent = text;

            messages.appendChild(div);

            messages.scrollTop =
                messages.scrollHeight;

        }


        async function sendAIMessage() {

            const input =
                document.getElementById("aiInput");

            const button =
                document.getElementById("sendAIButton");

            if (!input || !button) return;

            const question =
                input.value.trim();

            if (!question) return;

            addChatMessage(
                question,
                "user"
            );

            input.value = "";

            button.disabled = true;

            button.innerHTML =
                '<i data-lucide="loader-circle" style="width:15px;"></i>';

            refreshIcons();

            addChatMessage(
                "Let me explore that for you...",
                "ai"
            );

            const loadingMessage =
                document.querySelector(
                    "#chatMessages .message.ai:last-child"
                );


            try {

                /* -----------------------------------------------
                   EXISTING QUIZONE / SANSKRITISETU FLASK ENDPOINT
                   ----------------------------------------------- */

                const response =
                    await fetch(
                        "/api/ai/generate",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                prompt: `
You are SanskritiSetu AI, a cultural education assistant
focused on India's rich cultural heritage.

Answer the following user question accurately and simply.

Question:
${question}

Rules:
- Focus on Indian culture, heritage, traditions, history,
  festivals, arts, crafts, languages, food or regional culture.
- Explain in simple student-friendly language.
- If relevant, mention the region/state.
- Do not invent facts.
- If something is uncertain, clearly say so.
- Keep the answer informative but concise.
                                `.trim(),

                                question: question,

                                topic: "Indian Culture"

                            })

                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "AI server returned " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                let answer = "";


                /*
                    Different backend response formats
                    are handled here so small backend
                    changes don't break the UI.
                */

                if (typeof data === "string") {

                    answer = data;

                } else {

                    answer =
                        data.answer ||
                        data.response ||
                        data.result ||
                        data.text ||
                        data.content ||
                        data.message ||
                        "";

                }


                if (!answer) {

                    answer =
                        "I received a response, but could not read the AI answer. Please try again.";

                }


                if (loadingMessage) {

                    loadingMessage.textContent =
                        answer;

                }


            } catch (error) {

                console.error(
                    "AI error:",
                    error
                );


                if (loadingMessage) {

                    loadingMessage.textContent =
                        "AI service is currently unavailable. Please make sure your Flask backend is running and the /api/ai/generate endpoint is active.";

                }

                showToast(
                    "AI service is unavailable"
                );

            } finally {

                button.disabled = false;

                button.innerHTML =
                    '<i data-lucide="send" style="width:15px;"></i>';

                refreshIcons();

                const messages =
                    document.getElementById(
                        "chatMessages"
                    );

                if (messages) {

                    messages.scrollTop =
                        messages.scrollHeight;

                }

            }

        }

        function renderSection(
            section,
            updateHistory = true
        ) {

            if (!pageInfo[section]) {
                section = "dashboard";
            }


            /* Update active sidebar */

            document
                .querySelectorAll(".nav-item")
                .forEach(item => {

                    item.classList.toggle(
                        "active",
                        item.dataset.section === section
                    );

                });


            /* Update heading */

            document.getElementById("pageTitle")
                .textContent =
                pageInfo[section].title;

            document.getElementById("pageSubtitle")
                .textContent =
                pageInfo[section].subtitle;


            /* Render */

            switch (section) {

                case "dashboard":
                    renderDashboard();
                    break;

                case "artists":
                    renderArtists();
                    break;

                case "games":
                    renderGames();
                    break;

                case "map":
                    renderMap();
                    break;

                case "ai":
                    renderAI();
                    break;

                case "learning":
                    renderLearning();
                    break;

                case "badges":
                    renderBadges();
                    break;

                case "progress":
                    renderProgress();
                    break;

                case "profile":
                    renderProfile();
                    break;

                default:
                    renderDashboard();

            }


            /* Browser URL changes WITHOUT reload */

            if (updateHistory) {

                history.pushState(
                    { section: section },
                    "",
                    "#" + section
                );

            }


            /* Mobile sidebar close */

            if (
                window.innerWidth <= 850
            ) {

                closeSidebar();

            }


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }

                        updateUserUI();

                    }

                }
            );

        }

    } catch (error) {

        console.log(
            "Auth listener unavailable:",
            error
        );

    }

}
